<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordine maglie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch: #1d6b3b;
    --pitch-dark: #0e3f23;
    --chalk: #f7f8f1;
    --ink: #13261a;
    --muted: #5b6b60;
    --yellow: #f3c623;
    --red: #c8312b;
    --rule: #d9dccf;
    --display: "Oswald", "Arial Narrow", Impact, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: repeating-linear-gradient(90deg, #14502d 0 72px, #175a33 72px 144px);
    min-height: 100vh;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  .hidden { display: none !important; }

  h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: 0.01em; }

  .card {
    background: var(--chalk);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 22px; margin-bottom: 12px; }

  /* intestazione: il campo visto dall'alto */
  .pitch {
    position: relative;
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 4px;
    padding: 28px 24px;
    margin-bottom: 16px;
    color: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .pitch::before { /* linea di meta' campo */
    content: ""; position: absolute; top: 0; bottom: 0; left: 62%;
    border-left: 2px solid rgba(255,255,255,.35);
  }
  .pitch::after { /* cerchio di centro */
    content: ""; position: absolute; top: 50%; left: 62%;
    width: 150px; height: 150px; margin: -75px 0 0 -75px;
    border: 2px solid rgba(255,255,255,.35); border-radius: 50%;
  }
  .pitch > * { position: relative; z-index: 1; }
  .pitch h1 { font-size: clamp(30px, 7vw, 46px); line-height: 1.05; }
  .pitch p { margin: 6px 0 0; color: #d6efdc; }
  .shirt {
    flex: none;
    min-width: 92px;
    text-align: center;
    background: var(--yellow);
    color: var(--pitch-dark);
    border-radius: 6px;
    padding: 8px 12px 10px;
  }
  .shirt b { display: block; font-family: var(--display); font-weight: 600; font-size: 52px; line-height: 1; }
  .shirt span { font-size: 13px; font-weight: 600; }

  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  label small { font-weight: 400; color: var(--muted); }
  input, select {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid #b9c0ae;
    border-radius: 4px;
    padding: 9px 10px;
    min-height: 44px;
  }
  input::placeholder { text-transform: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .span2 { grid-column: span 2; }

  button, .btn {
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 4px;
    border: 2px solid var(--pitch);
    background: var(--pitch);
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button:hover, .btn:hover { background: var(--pitch-dark); border-color: var(--pitch-dark); }
  button:disabled { opacity: .6; cursor: progress; }
  button.ghost { background: transparent; color: var(--pitch-dark); }
  button.ghost:hover { background: #e7ebdc; }
  button.danger { background: transparent; border-color: var(--red); color: var(--red); }
  button.danger:hover { background: var(--red); color: #fff; }
  button.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn.shop { background: #fff; color: var(--pitch-dark); border-color: #fff; }
  .btn.shop:hover { background: var(--yellow); border-color: var(--yellow); }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  input:focus-visible, select:focus-visible { outline-color: var(--pitch); }

  .msg { margin: 10px 0 0; min-height: 22px; font-size: 15px; }
  .msg:empty { min-height: 0; }
  .msg.err { color: var(--red); font-weight: 600; }
  .msg.ok { color: var(--pitch); font-weight: 600; }
  #addMsg, #loginMsg, #adminMsg { min-height: 22px; }

  /* intestazione della rosa con il riepilogo taglie */
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .cardhead h2 { margin: 0; }
  .sizes { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 14px; border: 1.5px solid var(--rule); border-radius: 4px; padding: 1px 8px; color: var(--muted); background: #fff; }
  .chip b { font-family: var(--display); font-weight: 600; color: var(--pitch-dark); margin-right: 4px; }
  .chip.zero { opacity: .5; }

  /* elenco */
  .row {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr 0.5fr 1fr 0.4fr 1.5fr;
    gap: 12px;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid var(--rule);
  }
  .list.has-actions .row { grid-template-columns: 1.1fr 0.9fr 0.5fr 1fr 0.4fr 1.3fr 184px; }
  .row.head { border-top: 0; padding-top: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
  .row .nome { font-weight: 600; overflow-wrap: anywhere; }
  .row .giocatore, .row .numero { font-family: var(--display); font-weight: 600; letter-spacing: .04em; overflow-wrap: anywhere; }
  .row .note { color: var(--muted); overflow-wrap: anywhere; }
  .tag {
    display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; line-height: 18px;
    background: var(--yellow); color: var(--pitch-dark); border-radius: 3px; padding: 0 6px; vertical-align: 2px;
  }
  .size {
    display: inline-block; min-width: 40px; text-align: center;
    font-family: var(--display); font-weight: 600; font-size: 18px;
    border: 2px solid var(--pitch); border-radius: 4px; padding: 0 8px; color: var(--pitch-dark);
  }
  .row a { color: var(--pitch); font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { padding: 8px 0 0; color: var(--muted); margin: 0; }

  /* modifica di una riga: stesso schema del modulo di aggiunta */
  .editbox { border-top: 1px solid var(--rule); padding: 14px 0 16px; }
  .editbox .edittitle { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 10px; }
  .editbox .actions { margin-top: 10px; }

  .foot { text-align: center; margin-top: 8px; }
  .foot button { background: transparent; border-color: rgba(255,255,255,.6); color: #fff; }
  .foot button:hover { background: rgba(255,255,255,.15); }
  .adminbar { background: var(--yellow); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; color: var(--pitch-dark); }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .span2 { grid-column: auto; }
    .row, .list.has-actions .row { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .row.head { display: none; }
    .row .nome { grid-column: 1; }
    .row .taglia { grid-column: 2; grid-row: 1; }
    .row .linkcell, .row .note, .row .actions { grid-column: 1 / -1; }
    .row .giocatore { grid-column: 1; }
    .row .numero { grid-column: 2; text-align: center; }
    .row .giocatore:empty, .row .numero:empty, .row .note:empty { display: none; }
    .row .giocatore:not(:empty)::before { content: "Giocatore: "; font-family: var(--body); font-weight: 400; letter-spacing: 0; color: var(--muted); }
    .row .numero:not(:empty)::before { content: "N° "; font-family: var(--body); font-weight: 400; letter-spacing: 0; color: var(--muted); }
    .row .actions { margin-top: 6px; }
    .pitch::after { left: 78%; }
    .pitch::before { left: 78%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ACCESSO -->
  <section id="login">
    <div class="pitch">
      <div>
        <h1>Ordine maglie</h1>
        <p>Entra con la password che ti ha dato il capitano.</p>
      </div>
    </div>
    <form class="card" id="loginForm" autocomplete="off" novalidate>
      <label for="pwd">Password</label>
      <input id="pwd" type="password">
      <p class="msg" id="loginMsg" role="alert"></p>
      <button type="submit" id="loginBtn">Entra in campo</button>
    </form>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <div class="pitch">
      <div>
        <h1>Ordine maglie</h1>
        <p>Aggiungi la tua maglia: link, taglia e personalizzazione.</p>
        <p style="margin-top:14px"><a class="btn shop" href="https://www.11calcio-it.com/" target="_blank" rel="noopener noreferrer">Vai al negozio</a></p>
      </div>
      <div class="shirt" aria-live="polite"><b id="count">0</b><span id="countLabel">maglie in rosa</span></div>
    </div>

    <div id="adminBar" class="adminbar hidden">
      <span>Area admin attiva: puoi modificare ed eliminare tutte le righe.</span>
      <button class="small ghost" id="adminExit" type="button">Esci dall'area admin</button>
    </div>

    <form class="card" id="addForm" autocomplete="off" novalidate>
      <h2>Aggiungi la tua maglia</h2>
      <div class="grid">
        <div>
          <label for="nome">Il tuo nome</label>
          <input id="nome" name="nome" maxlength="50">
        </div>
        <div>
          <label for="taglia">Taglia</label>
          <select id="taglia" name="taglia"><option value="">Scegli</option></select>
        </div>
        <div class="span2">
          <label for="link">Link della maglia</label>
          <input id="link" name="link" type="url" inputmode="url" placeholder="https://www.11calcio-it.com/..." maxlength="500">
        </div>
        <div>
          <label for="stampa">Nome del giocatore <small>(facoltativo)</small></label>
          <input id="stampa" name="stampa" maxlength="15" placeholder="Es. LAUTARO" style="text-transform:uppercase">
        </div>
        <div>
          <label for="numero">Numero <small>(facoltativo)</small></label>
          <input id="numero" name="numero" maxlength="2" inputmode="numeric" placeholder="Es. 10">
        </div>
        <div class="span2">
          <label for="note">Note <small>(facoltativo)</small></label>
          <input id="note" name="note" maxlength="200" placeholder="Patch, versione retro, maniche lunghe...">
        </div>
      </div>
      <p class="msg" id="addMsg" role="status"></p>
      <button type="submit" id="addBtn">Aggiungi alla rosa</button>
    </form>

    <div class="card">
      <div class="cardhead">
        <h2>La rosa</h2>
        <div class="sizes" id="sizeSummary" aria-label="Maglie per taglia"></div>
      </div>
      <p class="msg" id="listMsg" role="alert"></p>
      <div id="list" class="list"></div>
    </div>

    <div class="foot">
      <button type="button" id="adminOpen" class="small">Area admin</button>
    </div>

    <form class="card hidden" id="adminForm" style="margin-top:16px" autocomplete="off" novalidate>
      <h2>Area admin</h2>
      <label for="adminPwd">Password admin</label>
      <input id="adminPwd" type="password">
      <p class="msg" id="adminMsg" role="alert"></p>
      <button type="submit" id="adminBtn">Accedi</button>
    </form>
  </section>
</div>

<script>
  // Dopo aver pubblicato lo script Google, incolla qui l'URL dell'app web (finisce con /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbyPa5LFzcUlee-FW4Qg5Sjd0paOfo8bfYYbHYugyUwMpWj62ZkYYfPfXGBwVpL1MXqpDw/exec';
  const TOKENS_KEY = 'ordine_maglie_tokens';

  const $ = (id) => document.getElementById(id);
  let pwd = '';
  let adminPwd = '';
  let isAdmin = false;
  let sizes = [];
  let uid = 0;

  // ---------- utilita' ----------

  async function api(payload) {
    if (API_URL.indexOf('https://') !== 0) {
      return { ok: false, error: 'Manca l\'URL dello script: va inserito in index.html.' };
    }
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    } catch (e) {
      return { ok: false, error: 'Connessione non riuscita. Controlla la rete e riprova.' };
    }
  }

  // i token permettono di modificare le proprie maglie da questo browser
  function readTokens() {
    try { return JSON.parse(localStorage.getItem(TOKENS_KEY)) || {}; } catch (e) { return {}; }
  }
  function writeTokens(map) {
    try { localStorage.setItem(TOKENS_KEY, JSON.stringify(map)); } catch (e) { /* storage non disponibile */ }
  }
  function sessGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sessSet(k, v) {
    try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* ignora */ }
  }

  function setMsg(target, text, kind) {
    const el = typeof target === 'string' ? $(target) : target;
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function withBusy(btn, label, fn) {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
    try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
  }

  function isHttpUrl(v) { return /^https?:\/\/\S+$/i.test(v); }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fillSizes(select, selected) {
    select.innerHTML = '';
    const first = el('option', '', 'Scegli');
    first.value = '';
    select.appendChild(first);
    sizes.forEach((s) => {
      const o = el('option', '', s);
      o.value = s;
      if (s === selected) o.selected = true;
      select.appendChild(o);
    });
  }

  // legge i campi di un modulo (aggiunta o modifica) e li controlla
  function collect(form) {
    const v = (n) => (form.elements[n] ? form.elements[n].value.trim() : '');
    return { nome: v('nome'), link: v('link'), taglia: v('taglia'), stampa: v('stampa').toUpperCase(), numero: v('numero'), note: v('note') };
  }
  function check(d) {
    if (!d.nome) return 'Inserisci il tuo nome.';
    if (!d.taglia) return 'Scegli una taglia.';
    if (!isHttpUrl(d.link)) return 'Il link deve iniziare con http:// o https://';
    if (d.numero && !/^\d{1,2}$/.test(d.numero)) return 'Il numero deve essere tra 0 e 99.';
    return '';
  }

  // ---------- elenco ----------

  function linkCell(url) {
    const td = el('div', 'linkcell');
    if (isHttpUrl(url)) {
      const a = el('a', '', 'Vedi maglia');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      td.appendChild(a);
    } else {
      td.textContent = '-';
    }
    return td;
  }


  function editAction(r, payload) {
    if (isAdmin) return Object.assign({ action: 'admin' + payload.kind, adminPwd: adminPwd, id: r.id }, payload.data);
    return Object.assign({ action: 'own' + payload.kind, pwd: pwd, id: r.id, token: readTokens()[r.id] || '' }, payload.data);
  }

  function renderRow(r) {
    const row = el('div', 'row');
    const nome = el('div', 'nome', r.nome);
    if (r.mine && !isAdmin) nome.appendChild(el('span', 'tag', 'la tua'));
    row.appendChild(nome);
    row.appendChild(linkCell(r.link));
    const t = el('div', 'taglia'); t.appendChild(el('span', 'size', r.taglia));
    row.appendChild(t);
    row.appendChild(el('div', 'giocatore', r.stampa || ''));
    row.appendChild(el('div', 'numero', r.numero || ''));
    row.appendChild(el('div', 'note', r.note || ''));
    if (isAdmin || r.mine) {
      const actions = el('div', 'actions');
      const edit = el('button', 'small ghost', 'Modifica'); edit.type = 'button';
      const del = el('button', 'small danger', 'Elimina'); del.type = 'button';
      edit.setAttribute('aria-label', 'Modifica la maglia di ' + r.nome);
      del.setAttribute('aria-label', 'Elimina la maglia di ' + r.nome);
      edit.addEventListener('click', () => {
        const box = editBox(r);
        row.replaceWith(box);
        box.querySelector('input').focus();
      });
      del.addEventListener('click', async () => {
        if (!confirm('Eliminare la maglia di ' + r.nome + '?')) return;
        await withBusy(del, 'Elimino...', async () => {
          const res = await api(editAction(r, { kind: 'Delete', data: {} }));
          if (res.ok) { setMsg('listMsg', ''); await loadList(); }
          else setMsg('listMsg', res.error || 'Errore.', 'err');
        });
      });
      actions.append(edit, del);
      row.appendChild(actions);
    }
    return row;
  }

  function field(labelText, control, cls) {
    const wrap = el('div', cls);
    control.id = 'f' + (++uid);
    const label = el('label', '', labelText);
    label.htmlFor = control.id;
    wrap.append(label, control);
    return wrap;
  }

  function input(name, value, props) {
    const i = document.createElement('input');
    i.name = name;
    i.value = value || '';
    Object.assign(i, props || {});
    return i;
  }

  function editBox(r) {
    const box = el('form', 'editbox');
    box.noValidate = true;
    box.autocomplete = 'off';
    box.appendChild(el('p', 'edittitle', 'Modifica la maglia di ' + r.nome));
    const taglia = document.createElement('select');
    taglia.name = 'taglia';
    fillSizes(taglia, r.taglia);
    const stampa = input('stampa', r.stampa, { maxLength: 15 });
    stampa.style.textTransform = 'uppercase';
    const grid = el('div', 'grid');
    grid.append(
      field('Nome', input('nome', r.nome, { maxLength: 50 })),
      field('Taglia', taglia),
      field('Link della maglia', input('link', r.link, { maxLength: 500, type: 'url', inputMode: 'url' }), 'span2'),
      field('Nome del giocatore', stampa),
      field('Numero', input('numero', r.numero, { maxLength: 2, inputMode: 'numeric' })),
      field('Note', input('note', r.note, { maxLength: 200 }), 'span2')
    );
    const msg = el('p', 'msg'); msg.setAttribute('role', 'alert');
    const actions = el('div', 'actions');
    const save = el('button', 'small', 'Salva'); save.type = 'submit';
    const cancel = el('button', 'small ghost', 'Annulla'); cancel.type = 'button';
    actions.append(save, cancel);
    box.append(grid, msg, actions);

    cancel.addEventListener('click', () => box.replaceWith(renderRow(r)));
    box.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = collect(box);
      const err = check(d);
      if (err) { setMsg(msg, err, 'err'); return; }
      await withBusy(save, 'Salvo...', async () => {
        const res = await api(editAction(r, { kind: 'Update', data: d }));
        if (res.ok) await loadList();
        else setMsg(msg, res.error || 'Errore.', 'err');
      });
    });
    return box;
  }

  function renderSummary(rows) {
    const box = $('sizeSummary');
    box.innerHTML = '';
    if (!rows.length) return;
    const counts = {};
    rows.forEach((r) => { counts[r.taglia] = (counts[r.taglia] || 0) + 1; });
    const order = sizes.concat(Object.keys(counts).filter((s) => sizes.indexOf(s) < 0));
    order.forEach((s) => {
      const n = counts[s] || 0;
      const chip = el('span', 'chip' + (n ? '' : ' zero'));
      chip.appendChild(el('b', '', s));
      chip.appendChild(document.createTextNode(String(n)));
      box.appendChild(chip);
    });
  }

  async function loadList() {
    const tokens = readTokens();
    const res = isAdmin
      ? await api({ action: 'adminList', adminPwd: adminPwd })
      : await api({ action: 'list', pwd: pwd, tokens: Object.values(tokens) });
    const list = $('list');
    if (!res.ok) {
      setMsg('listMsg', res.error || 'Impossibile caricare l\'elenco.', 'err');
      return res;
    }
    // tiene solo i token delle righe che esistono ancora
    if (!isAdmin) {
      const keep = {};
      res.rows.forEach((r) => { if (r.mine && tokens[r.id]) keep[r.id] = tokens[r.id]; });
      writeTokens(keep);
    }
    sizes = res.sizes || sizes;
    if ($('taglia').options.length <= 1) fillSizes($('taglia'));

    const n = res.rows.length;
    $('count').textContent = n;
    $('countLabel').textContent = n === 1 ? 'maglia in rosa' : 'maglie in rosa';
    renderSummary(res.rows);

    list.innerHTML = '';
    const withActions = isAdmin || res.rows.some((r) => r.mine);
    list.className = 'list' + (withActions ? ' has-actions' : '');
    if (!n) {
      list.appendChild(el('p', 'empty', 'Nessuna maglia ancora. Aggiungi la prima.'));
      return res;
    }
    const head = el('div', 'row head');
    ['Nome', 'Maglia', 'Taglia', 'Giocatore', 'N°', 'Note'].forEach((h) => head.appendChild(el('div', '', h)));
    if (withActions) head.appendChild(el('div', ''));
    list.appendChild(head);
    res.rows.forEach((r) => list.appendChild(renderRow(r)));
    return res;
  }

  function showApp() {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
  }

  // ---------- eventi ----------

  // accesso amici
  $('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const value = $('pwd').value;
    if (!value) { setMsg('loginMsg', 'Inserisci la password.', 'err'); return; }
    await withBusy($('loginBtn'), 'Controllo...', async () => {
      setMsg('loginMsg', '');
      const res = await api({ action: 'list', pwd: value });
      if (!res.ok) { setMsg('loginMsg', res.error || 'Errore.', 'err'); return; }
      pwd = value;
      sessSet('pwd', pwd);
      showApp();
      await loadList();
    });
  });

  // aggiunta maglia
  $('addForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const d = collect($('addForm'));
    const err = check(d);
    if (err) { setMsg('addMsg', err, 'err'); return; }
    setMsg('addMsg', '');
    await withBusy($('addBtn'), 'Invio in corso...', async () => {
      const res = await api(Object.assign({ action: 'add', pwd: pwd }, d));
      if (!res.ok) { setMsg('addMsg', res.error || 'Errore.', 'err'); return; }
      if (res.id && res.token) {
        const tokens = readTokens();
        tokens[res.id] = res.token;
        writeTokens(tokens);
      }
      $('addForm').reset();
      setMsg('addMsg', 'Maglia aggiunta alla rosa. Da questo browser potrai modificarla o eliminarla.', 'ok');
      await loadList();
    });
  });

  // area admin
  $('adminOpen').addEventListener('click', () => {
    $('adminForm').classList.toggle('hidden');
    if (!$('adminForm').classList.contains('hidden')) $('adminPwd').focus();
  });
  $('adminForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const value = $('adminPwd').value;
    if (!value) { setMsg('adminMsg', 'Inserisci la password admin.', 'err'); return; }
    await withBusy($('adminBtn'), 'Controllo...', async () => {
      setMsg('adminMsg', '');
      const res = await api({ action: 'adminList', adminPwd: value });
      if (!res.ok) { setMsg('adminMsg', res.error || 'Errore.', 'err'); return; }
      adminPwd = value;
      isAdmin = true;
      $('adminPwd').value = '';
      $('adminForm').classList.add('hidden');
      $('adminOpen').classList.add('hidden');
      $('adminBar').classList.remove('hidden');
      setMsg('listMsg', '');
      await loadList();
    });
  });
  $('adminExit').addEventListener('click', () => {
    isAdmin = false; adminPwd = '';
    $('adminBar').classList.add('hidden');
    $('adminOpen').classList.remove('hidden');
    setMsg('listMsg', '');
    loadList();
  });

  // se la password e' gia' stata inserita in questa scheda, entra direttamente
  (async () => {
    const saved = sessGet('pwd');
    if (!saved) return;
    pwd = saved;
    const res = await loadList();
    if (res.ok) showApp();
    else { pwd = ''; sessSet('pwd', null); setMsg('listMsg', ''); }
  })();
</script>
</body>
</html>
